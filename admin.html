<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin ♡ SeaSea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #fff0f3;
      --card-bg: rgba(255, 255, 255, 0.96);
      --deep-pink: #fb6f92;
      --border-pink: #ffc2d1;
      --text-main: #4a3b3e;
      --text-muted: #9c8287;
      --glow-shadow: 0 10px 30px rgba(251, 111, 146, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #ffe5ec 0%, #fff0f3 55%, #ffe8ed 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 80px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    #loginView {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-card {
      background: var(--card-bg);
      border-radius: 30px;
      padding: 38px 24px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-pink);
      text-align: center;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-field, .textarea-field {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-pink);
      border-radius: 18px;
      font-size: 14px;
      background: #fff;
      color: var(--text-main);
      outline: none;
    }

    .btn-pink {
      width: 100%;
      background: linear-gradient(135deg, #ffc2d1, var(--deep-pink));
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 20px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(251, 111, 146, 0.35);
      margin-top: 10px;
    }

    #dashboardView { display: none; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .panel-card {
      background: var(--card-bg);
      border-radius: 26px;
      padding: 22px 18px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-pink);
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--deep-pink);
      margin-bottom: 14px;
    }

    .preview-banner {
      width: 100%;
      height: 110px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 10px;
      display: none;
      border: 2px solid #fff;
    }

    .preview-profile {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px;
      display: none;
      border: 3px solid var(--border-pink);
    }

    .hl-admin-card {
      background: #ffffff;
      border: 1.5px solid var(--border-pink);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .hl-cover-preview {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-pink);
    }

    .stories-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .story-slot {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1px dashed var(--border-pink);
      overflow: hidden;
      background: #fffafa;
    }

    .story-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .del-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(255, 77, 109, 0.9);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      cursor: pointer;
    }

    .file-btn {
      display: inline-block;
      background: linear-gradient(135deg, #ffc2d1, var(--deep-pink));
      color: #fff;
      padding: 7px 18px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Login -->
    <div id="loginView">
      <div class="login-card">
        <h2 style="color:var(--deep-pink); margin-bottom:20px;">Admin Login ♡</h2>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="emailInput" class="input-field" placeholder="seasea1.2554@gmail.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="passwordInput" class="input-field" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-pink">เข้าสู่ระบบ ✨</button>
          <p id="loginError" style="color:#ff4d6d; font-size:12px; margin-top:10px; display:none;">อีเมลหรือรหัสผ่านไม่ถูกต้องค่ะ</p>
        </form>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardView">
      <div class="top-bar">
        <div style="font-weight:700; color:var(--deep-pink); font-size:19px;">Dashboard ♡ SeaSea</div>
        <button onclick="handleLogout()" style="background:#fff; border:1.5px solid var(--border-pink); padding:6px 16px; border-radius:18px; color:var(--deep-pink); font-size:12px; cursor:pointer;">ออกระบบ</button>
      </div>

      <!-- ข้อมูลร้าน -->
      <div class="panel-card">
        <div class="panel-title">🎀 ข้อมูลร้านและรูปภาพ</div>
        
        <div class="form-group">
          <label>รูปแบนเนอร์:</label>
          <img id="bannerPreview" class="preview-banner">
          <label class="file-btn">
            เลือกรูปแบนเนอร์
            <input type="file" accept="image/*" style="display:none;" onchange="handleImageFile(this, 'bannerPreview', 'banner', 1000)">
          </label>
        </div>

        <div class="form-group" style="margin-top:10px;">
          <label>รูปโปรไฟล์:</label>
          <img id="profilePreview" class="preview-profile">
          <label class="file-btn">
            เลือกรูปโปรไฟล์
            <input type="file" accept="image/*" style="display:none;" onchange="handleImageFile(this, 'profilePreview', 'profile', 500)">
          </label>
        </div>

        <div class="form-group">
          <label>ชื่อร้าน</label>
          <input type="text" id="storeNameInput" class="input-field" placeholder="liho ♡">
        </div>

        <div class="form-group">
          <label>คำอธิบายร้าน</label>
          <textarea id="storeBioInput" class="textarea-field" rows="3"></textarea>
        </div>
      </div>

      <!-- จัดการไฮไลท์ 3 รายการ -->
      <div class="panel-card">
        <div class="panel-title">✨ จัดการไฮไลท์ 3 รายการ (อัปโหลดคมชัด HD)</div>
        <div id="highlightsAdminBox"></div>
      </div>

      <!-- ลิงก์เพลง -->
      <div class="panel-card">
        <div class="panel-title">🎵 ลิงก์เพลงพื้นหลัง (Auto-play .mp3)</div>
        <input type="url" id="musicUrlInput" class="input-field" placeholder="https://files.catbox.moe/...">
      </div>

      <button type="button" class="btn-pink" id="saveAllBtn" style="font-size:16px; padding:15px; margin-bottom:20px;" onclick="saveAllToCloud()">
        ☁️ บันทึกขึ้นระบบทันที ♡
      </button>

      <!-- รีวิว -->
      <div class="panel-card">
        <div class="panel-title">🗑️ รีวิวจากลูกค้า</div>
        <div id="reviewsAdminContainer"></div>
      </div>
    </div>

  </div>

  <script>
    const AUTH_EMAIL = "seasea1.2554@gmail.com";
    const AUTH_PASS = "jeng27128";

    // คอลเลกชันใหม่แยกอิสระ 100%
    const DB_SITE = "seasea_single_site";
    const DB_REVIEWS = "seasea_single_reviews";

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let siteData = {
      banner: "https://i.postimg.cc/26YfhPc1/CA378830-D049-4F10-B91D-83E369F619D9.gif",
      profile: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg",
      storeName: "liho ♡",
      storeBio: "ยินดีต้อนรับเข้าสู่ร้าน liho ♡\nสามารถกดดูไฮไลท์ที่เราลงไว้เพื่อดูตัวอย่างได้เลย ขอบคุณที่กดเข้ามานะคะ",
      musicUrl: "",
      highlights: [
        { title: "face 💕", cover: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg", stories: [] },
        { title: "Review 2", cover: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg", stories: [] },
        { title: "Review 3", cover: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg", stories: [] }
      ]
    };

    window.onload = function() {
      if (sessionStorage.getItem('seasea_single_auth') === 'true') {
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      if (email === AUTH_EMAIL && pass === AUTH_PASS) {
        sessionStorage.setItem('seasea_single_auth', 'true');
        showDashboard();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('seasea_single_auth');
      location.reload();
    }

    async function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';

      try {
        const doc = await db.collection(DB_SITE).doc("content").get();
        if (doc.exists) siteData = { ...siteData, ...doc.data() };
      } catch (err) {}

      renderAdminPanels();
      listenReviewsAdmin();
    }

    function renderAdminPanels() {
      if (siteData.banner) {
        const b = document.getElementById('bannerPreview');
        b.src = siteData.banner;
        b.style.display = 'block';
      }
      if (siteData.profile) {
        const p = document.getElementById('profilePreview');
        p.src = siteData.profile;
        p.style.display = 'block';
      }
      document.getElementById('storeNameInput').value = siteData.storeName || '';
      document.getElementById('storeBioInput').value = siteData.storeBio || '';
      document.getElementById('musicUrlInput').value = siteData.musicUrl || '';

      const hlBox = document.getElementById('highlightsAdminBox');
      hlBox.innerHTML = '';

      siteData.highlights.forEach((hl, hIdx) => {
        const card = document.createElement('div');
        card.className = 'hl-admin-card';

        let storiesHTML = '';
        if (hl.stories) {
          hl.stories.forEach((stImg, sIdx) => {
            storiesHTML += `
              <div class="story-slot">
                <img src="${stImg}">
                <button class="del-btn" onclick="removeStoryImage(${hIdx}, ${sIdx})">✕</button>
              </div>
            `;
          });
        }

        card.innerHTML = `
          <div style="font-weight: 700; color: var(--deep-pink); margin-bottom: 8px;">ไฮไลท์ที่ ${hIdx + 1}</div>
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
            <img src="${hl.cover || 'https://i.ibb.co/gZg1bdv9/IMG-3203.jpg'}" class="hl-cover-preview" id="hlCoverPreview_${hIdx}">
            <div style="flex:1;">
              <input type="text" id="hlTitle_${hIdx}" class="input-field" value="${hl.title || ''}" placeholder="ชื่อไฮไลท์" style="margin-bottom:6px;">
              <label class="file-btn" style="font-size:11px; padding:4px 12px;">
                เปลี่ยนปก
                <input type="file" accept="image/*" style="display:none;" onchange="changeHlCover(this, ${hIdx})">
              </label>
            </div>
          </div>
          <label class="file-btn" style="font-size:12px; margin-bottom:6px;">
            + เพิ่มรูปสตอรี่ (ชัด HD)
            <input type="file" accept="image/*" multiple style="display:none;" onchange="addStoryImages(this, ${hIdx})">
          </label>
          <div class="stories-grid">${storiesHTML}</div>
        `;
        hlBox.appendChild(card);
      });
    }

    // ฟังก์ชันบีบอัดรูปภาพคุณภาพสูง (1200px / 0.92) รูปไม่แตก
    function compressImage(file, maxWidth, quality) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleImageFile(input, previewId, key, maxWidth) {
      if (input.files && input.files[0]) {
        const b64 = await compressImage(input.files[0], maxWidth, 0.9);
        siteData[key] = b64;
        const imgElem = document.getElementById(previewId);
        imgElem.src = b64;
        imgElem.style.display = 'block';
      }
    }

    async function changeHlCover(input, hlIdx) {
      if (input.files && input.files[0]) {
        const b64 = await compressImage(input.files[0], 400, 0.9);
        siteData.highlights[hlIdx].cover = b64;
        document.getElementById(`hlCoverPreview_${hlIdx}`).src = b64;
      }
    }

    async function addStoryImages(input, hlIdx) {
      if (input.files && input.files.length) {
        if (!siteData.highlights[hlIdx].stories) siteData.highlights[hlIdx].stories = [];
        for (const file of Array.from(input.files)) {
          const b64 = await compressImage(file, 1200, 0.92);
          siteData.highlights[hlIdx].stories.push(b64);
        }
        renderAdminPanels();
      }
    }

    function removeStoryImage(hlIdx, storyIdx) {
      siteData.highlights[hlIdx].stories.splice(storyIdx, 1);
      renderAdminPanels();
    }

    async function saveAllToCloud() {
      const btn = document.getElementById('saveAllBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึกข้อมูล... ⏳';

      siteData.storeName = document.getElementById('storeNameInput').value;
      siteData.storeBio = document.getElementById('storeBioInput').value;
      siteData.musicUrl = document.getElementById('musicUrlInput').value.trim();

      for (let i = 0; i < 3; i++) {
        const t = document.getElementById(`hlTitle_${i}`).value.trim();
        siteData.highlights[i].title = t || `Highlight ${i + 1}`;
      }

      try {
        await db.collection(DB_SITE).doc("content").set(siteData);
        alert('✨ บันทึกข้อมูลและไฮไลท์ทั้งหมดเรียบร้อยแล้วค่ะ!');
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่อีกครั้ง');
      } finally {
        btn.disabled = false;
        btn.textContent = '☁️ บันทึกขึ้นระบบทันที ♡';
      }
    }

    function listenReviewsAdmin() {
      db.collection(DB_REVIEWS).orderBy("createdAt", "desc").onSnapshot(snapshot => {
        const container = document.getElementById('reviewsAdminContainer');
        if (snapshot.empty) {
          container.innerHTML = '<p style="text-align:center; font-size:13px; color:var(--text-muted);">ไม่มีรีวิวในระบบ</p>';
          return;
        }
        let html = '';
        snapshot.forEach(doc => {
          const r = doc.data();
          html += `
            <div style="background:#fff; border:1px solid var(--border-pink); border-radius:16px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:700; font-size:13.5px;">${r.name} (${'⭐️'.repeat(r.stars || 5)})</div>
                <div style="font-size:12.5px; color:#635355;">${r.feedback}</div>
              </div>
              <button onclick="deleteReview('${doc.id}')" style="background:#fff0f3; border:1px solid var(--border-pink); color:var(--deep-pink); padding:4px 10px; border-radius:12px; font-size:11px; cursor:pointer;">ลบ 🗑️</button>
            </div>
          `;
        });
        container.innerHTML = html;
      });
    }

    async function deleteReview(docId) {
      if (confirm('ต้องการลบรีวิวนี้ใช่หรือไม่คะ? 🗑️')) {
        await db.collection(DB_REVIEWS).doc(docId).delete();
      }
    }
  </script>
</body>
</html>
